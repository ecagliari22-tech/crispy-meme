<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escritor IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="desk">
            <div id="paper-container">
                <div id="paper-bg"></div>
                <canvas id="writing-canvas"></canvas>
                <div id="pen" class="hidden"></div>
            </div>
            <div id="desk-spooky-overlay" class="hidden"></div>
        </div>

        <div id="ui-overlay">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Pergunte em qualquer idioma ou escrita..." maxlength="500">
                <button id="send-btn">Enviar</button>
            </div>
            <div class="controls-row">
                <div class="mode-switch">
                    <label>
                        <input type="checkbox" id="manual-mode-toggle">
                        Modo Manual
                    </label>
                </div>
                <div id="status">Pronto</div>
                <button id="settings-toggle-btn">Configurações</button>
            </div>
        </div>

        <div id="settings-panel" class="hidden">
            <div class="settings-header">
                <h3>Configurações</h3>
                <button id="close-settings">×</button>
            </div>
            
            <div class="settings-grid">
                <div class="settings-column">
                    <h4>Estilo da Caligrafia</h4>
                    <div class="setting-item">
                        <label>Desleixo</label>
                        <input type="range" id="sloppiness-slider" min="0" max="5" step="0.1" value="0.5">
                    </div>
                    <div class="setting-item">
                        <label>Curvatura</label>
                        <input type="range" id="curvature-slider" min="0" max="3" step="0.1" value="0.3">
                    </div>
                    <div class="setting-item">
                        <label>Inclinação</label>
                        <input type="range" id="slant-slider" min="-1" max="1" step="0.1" value="0.2">
                    </div>
                    <div class="setting-item">
                        <label>Var. de Altura</label>
                        <input type="range" id="height-variance-slider" min="0" max="1" step="0.05" value="0.2">
                    </div>
                    <div class="setting-item">
                        <label>Tam. do Texto</label>
                        <input type="range" id="text-size-slider" min="0.4" max="1.5" step="0.05" value="1.0">
                    </div>
                </div>

                <div class="settings-column">
                    <h4>Tipo de Caneta</h4>
                    <div class="pen-type-grid">
                        <label class="pen-option">
                            <input type="radio" name="pen-type" value="ballpoint" checked>
                            <span>Esferográfica</span>
                        </label>
                        <label class="pen-option">
                            <input type="radio" name="pen-type" value="pencil">
                            <span>Lápis ✏️</span>
                        </label>
                        <label class="pen-option">
                            <input type="radio" name="pen-type" value="magic">
                            <span class="magic-label">Mágica ✨</span>
                        </label>
                        <label class="pen-option">
                            <input type="radio" name="pen-type" value="spooky">
                            <span class="spooky-label">Assustadora 🕯️</span>
                        </label>
                    </div>

                    <div id="ink-color-section" class="setting-item">
                        <label>Cor da Tinta</label>
                        <div class="color-picker-container">
                            <input type="color" id="ink-color" value="#141928">
                        </div>
                    </div>

                    <h4>Efeitos Visuais</h4>
                    <div class="setting-item row">
                        <label><input type="checkbox" id="jitter-toggle"> Tremor</label>
                        <label><input type="checkbox" id="wobble-toggle"> Oscilação</label>
                    </div>
                    
                    <h4>Estilo do Papel</h4>
                    <div class="paper-style-grid">
                        <label class="paper-option">
                            <input type="radio" name="paper-style" value="default" checked>
                            <span>Padrão</span>
                        </label>
                        <label class="paper-option">
                            <input type="radio" name="paper-style" value="worn">
                            <span>Envelhecido 📜</span>
                        </label>
                        <label class="paper-option">
                            <input type="radio" name="paper-style" value="notepaper">
                            <span>Bloco de Notas 📝</span>
                        </label>
                    </div>

                    <div class="setting-item">
                        <label>Zoom</label>
                        <input type="range" id="zoom-slider" min="0.5" max="2" step="0.1" value="1.0">
                    </div>

                    <div class="setting-item hidden-mobile">
                        <label>Espaçamento</label>
                        <input type="range" id="word-variance-slider" min="0" max="1" step="0.05" value="0.25">
                    </div>
                </div>
            </div>
            <!-- Hidden inputs for logic consistency -->
            <input type="hidden" id="line-variance-slider" value="0.15">
            <input type="checkbox" id="spacing-toggle" style="display:none">
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "handwriting": "./handwriting.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
