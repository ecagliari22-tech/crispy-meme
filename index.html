<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bouncy 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
        }
        #score {
            background: linear-gradient(135deg, rgba(255, 107, 237, 0.9), rgba(103, 126, 234, 0.9));
            padding: 15px 35px;
            border-radius: 50px;
            display: inline-block;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        #combo {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.8), 2px 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #combo.show {
            opacity: 1;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(103, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255,255,255,0.3);
        }
        #gameOver h2 {
            background: linear-gradient(135deg, #ff6b6b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,107,107,0.5);
        }
        #gameOver p {
            color: white;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #restartBtn {
            background: linear-gradient(135deg, #ff6b6b, #ffd700);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
            box-shadow: 0 8px 25px rgba(255,107,107,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #restartBtn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(255,107,107,0.6);
        }
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 3s infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        .collect-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffd700, #ff6b6b);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: explode 0.6s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div id="ui">
        <div id="score">✨ 0</div>
        <div id="combo"></div>
    </div>
    <div id="gameOver">
        <h2>🎮 Game Over! 🎮</h2>
        <p id="finalScore">Pontos: 0</p>
        <button id="restartBtn">🔄 Jogar Novamente</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const particlesContainer = document.getElementById('particles');

        let scene, camera, renderer, ball, platform;
        let obstacles = [];
        let collectibles = [];
        let score = 0;
        let combo = 0;
        let gameActive = true;
        let ballVelocity = { x: 0, y: 0, z: -0.15 };
        let platformSpeed = 0.12;
        let touchStartX = 0;

        function createParticles() {
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particle.style.animationDuration = (2 + Math.random() * 2) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        function createCollectParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'collect-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / 12;
                const distance = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 600);
            }
        }

        function init() {
            createParticles();

            scene = new THREE.Scene();
            const gradientColors = [
                new THREE.Color(0x667eea),
                new THREE.Color(0x764ba2),
                new THREE.Color(0xf093fb)
            ];
            scene.background = gradientColors[0];
            scene.fog = new THREE.Fog(0x667eea, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 10);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff6bff, 1, 50);
            pointLight1.position.set(-10, 10, 0);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x6bffff, 1, 50);
            pointLight2.position.set(10, 10, 0);
            scene.add(pointLight2);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(5, 15, 5);
            scene.add(directionalLight);

            const ballGeometry = new THREE.SphereGeometry(0.5, 16, 16);
            const ballMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff6bff,
                metalness: 0.7,
                roughness: 0.2,
                emissive: 0xff1493,
                emissiveIntensity: 0.3
            });
            ball = new THREE.Mesh(ballGeometry, ballMaterial);
            ball.position.set(0, 1, 0);
            scene.add(ball);

            const platformGeometry = new THREE.BoxGeometry(7, 0.3, 60);
            const platformMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4ecdc4,
                metalness: 0.5,
                roughness: 0.3,
                emissive: 0x00ffff,
                emissiveIntensity: 0.2
            });
            platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.set(0, -0.5, 0);
            scene.add(platform);

            const gridHelper = new THREE.GridHelper(60, 30, 0xff00ff, 0x00ffff);
            gridHelper.position.y = -0.4;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            createObstacles();
            createCollectibles();

            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('touchstart', onTouchStart);
            canvas.addEventListener('touchmove', onTouchMove);
            canvas.addEventListener('mousemove', onMouseMove);
            restartBtn.addEventListener('click', restartGame);

            animate();
        }

        function createObstacles() {
            const colors = [
                0xff1744, 0xf50057, 0xd500f9, 0x651fff,
                0x3d5afe, 0x00b0ff, 0x00e5ff, 0x1de9b6,
                0x76ff03, 0xffea00, 0xffc400, 0xff6e40
            ];
            
            for (let i = 0; i < 15; i++) {
                const geometry = new THREE.IcosahedronGeometry(0.6, 0);
                const material = new THREE.MeshStandardMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    metalness: 0.7,
                    roughness: 0.2,
                    emissive: colors[Math.floor(Math.random() * colors.length)],
                    emissiveIntensity: 0.4,
                    flatShading: true
                });
                const obstacle = new THREE.Mesh(geometry, material);
                obstacle.position.set(
                    (Math.random() - 0.5) * 5.5,
                    0.5,
                    -10 - i * 5
                );
                obstacles.push(obstacle);
                scene.add(obstacle);
            }
        }

        function createCollectibles() {
            for (let i = 0; i < 18; i++) {
                const geometry = new THREE.OctahedronGeometry(0.35, 0);
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xffd700,
                    emissive: 0xffd700,
                    emissiveIntensity: 0.8,
                    metalness: 1,
                    roughness: 0.1
                });
                const collectible = new THREE.Mesh(geometry, material);
                collectible.position.set(
                    (Math.random() - 0.5) * 5,
                    0.5,
                    -5 - i * 4
                );
                collectibles.push(collectible);
                scene.add(collectible);
            }
        }

        function onTouchStart(e) {
            touchStartX = e.touches[0].clientX;
        }

        function onTouchMove(e) {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            const deltaX = (touchX - touchStartX) * 0.015;
            ball.position.x += deltaX;
            ball.position.x = Math.max(-3, Math.min(3, ball.position.x));
            touchStartX = touchX;
        }

        function onMouseMove(e) {
            if (!gameActive) return;
            const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            ball.position.x = mouseX * 3;
        }

        function showCombo() {
            if (combo > 1) {
                comboEl.textContent = `🔥 COMBO x${combo} 🔥`;
                comboEl.classList.add('show');
                setTimeout(() => {
                    comboEl.classList.remove('show');
                }, 1000);
            }
        }

        function checkCollisions() {
            obstacles.forEach((obstacle, index) => {
                const distance = ball.position.distanceTo(obstacle.position);
                if (distance < 0.9) {
                    endGame();
                }

                if (obstacle.position.z > 12) {
                    obstacle.position.z = -70;
                    obstacle.position.x = (Math.random() - 0.5) * 5.5;
                    const colors = [0xff1744, 0xf50057, 0xd500f9, 0x651fff, 0x3d5afe, 0x00b0ff, 0x00e5ff, 0x1de9b6];
                    obstacle.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
                    obstacle.material.emissive.setHex(colors[Math.floor(Math.random() * colors.length)]);
                }
            });

            collectibles.forEach((collectible, index) => {
                const distance = ball.position.distanceTo(collectible.position);
                if (distance < 0.85) {
                    const screenPos = collectible.position.clone();
                    screenPos.project(camera);
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (screenPos.y * -0.5 + 0.5) * window.innerHeight;
                    createCollectParticles(x, y);
                    
                    scene.remove(collectible);
                    collectibles.splice(index, 1);
                    combo++;
                    score += 10 * combo;
                    scoreEl.textContent = `✨ ${score}`;
                    showCombo();

                    const geometry = new THREE.OctahedronGeometry(0.35, 0);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: 0xffd700,
                        emissive: 0xffd700,
                        emissiveIntensity: 0.8,
                        metalness: 1,
                        roughness: 0.1
                    });
                    const newCollectible = new THREE.Mesh(geometry, material);
                    newCollectible.position.set(
                        (Math.random() - 0.5) * 5,
                        0.5,
                        -70
                    );
                    collectibles.push(newCollectible);
                    scene.add(newCollectible);
                }

                if (collectible.position.z > 12) {
                    collectible.position.z = -70;
                    collectible.position.x = (Math.random() - 0.5) * 5;
                    combo = 0;
                }
            });
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'block';
            finalScoreEl.textContent = `✨ Pontuação Final: ${score} ✨`;
        }

        function restartGame() {
            gameActive = true;
            score = 0;
            combo = 0;
            scoreEl.textContent = '✨ 0';
            gameOverEl.style.display = 'none';
            ball.position.set(0, 1, 0);
            platformSpeed = 0.12;
            
            obstacles.forEach((obs, i) => obs.position.z = -10 - i * 5);
            collectibles.forEach((col, i) => col.position.z = -5 - i * 4);
        }

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            if (gameActive) {
                obstacles.forEach(obstacle => {
                    obstacle.position.z += platformSpeed;
                    obstacle.rotation.x += 0.03;
                    obstacle.rotation.y += 0.02;
                });

                collectibles.forEach(collectible => {
                    collectible.position.z += platformSpeed;
                    collectible.rotation.x += 0.05;
                    collectible.rotation.y += 0.05;
                    collectible.position.y = 0.5 + Math.sin(time + collectible.position.z * 0.1) * 0.2;
                });

                ball.rotation.x += 0.02;
                ball.rotation.y += 0.02;

                scene.background.lerpColors(
                    new THREE.Color(0x667eea),
                    new THREE.Color(0xf093fb),
                    (Math.sin(time * 0.5) + 1) / 2
                );

                checkCollisions();

                score += 1;
                scoreEl.textContent = `✨ ${score}`;

                platformSpeed += 0.00008;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
